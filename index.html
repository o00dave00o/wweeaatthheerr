<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Chart</title>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 24px 32px;
      display: flex;
      flex-direction: column;
    }

    .container {
      max-width: 1720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    header {
      text-align: center;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 6px;
      letter-spacing: -0.02em;
    }

    .controls {
      background: var(--card-bg);
      padding: 20px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      position: relative;
      z-index: 10;
    }

    .search-group {
      position: relative;
      flex: 1;
      min-width: 320px;
      max-width: 520px;
    }

    .search-group label {
      display: block;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .search-input-wrapper {
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 1.05rem;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .suggestions-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-height: 320px;
      overflow-y: auto;
      z-index: 1000;
      margin-top: 6px;
      box-shadow: 0 10px 20px -3px rgba(0, 0, 0, 0.6);
      display: none;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .suggestion-item:last-child {
      border-bottom: none;
    }

    .suggestion-item:hover {
      background-color: var(--bg);
    }

    .suggestion-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .suggestion-name {
      font-weight: 600;
      color: var(--text);
      font-size: 1.05rem;
    }

    .suggestion-coords {
      font-size: 0.85rem;
      color: var(--muted);
      font-family: monospace;
    }

    .suggestion-details {
      font-size: 0.9rem;
      color: var(--accent);
    }

    .date-group {
      flex: 2;
      min-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .date-group label {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
    }

    .date-buttons-wrapper {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .date-btn {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      min-width: 95px;
    }

    .date-btn:hover {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
    }

    .date-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 700;
    }

    .date-btn .btn-sub {
      font-size: 0.75rem;
      opacity: 0.85;
      font-weight: normal;
    }

    .location-info {
      color: var(--accent);
      font-weight: 600;
      font-size: 1.1rem;
      width: 100%;
      text-align: center;
      margin-top: 6px;
    }

    .chart-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .chart-container {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 550px;
    }

    .error-msg {
      display: none;
      background: #7f1d1d;
      color: #fca5a5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      text-align: center;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Weather Chart</h1>
    </header>

    <div class="controls">
      <!-- Search Box -->
      <div class="search-group">
        <label for="search-input">Search Location (Town/City/County):</label>
        <div class="search-input-wrapper">
          <input type="text" id="search-input" placeholder="..." autocomplete="off" />
          <div id="suggestions" class="suggestions-list"></div>
        </div>
      </div>

      <!-- Single Click Date Buttons -->
      <div class="date-group">
        <label>Select Day</label>
        <div class="date-buttons-wrapper" id="date-buttons-container"></div>
      </div>

      <div class="location-info" id="location-text">Loading location...</div>
    </div>

    <div id="error" class="error-msg"></div>

    <!-- Scaled Chart Container -->
    <div class="chart-card">
      <div class="chart-container">
        <canvas id="scatterChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    // 10 Stable, Verified Models
    const MODEL_CONFIG = [
      { id: 'ecmwf_ifs025', label: 'ECMWF', color: '#38bdf8' },
      { id: 'gfs_seamless', label: 'GFS (NOAA)', color: '#ef4444' },
      { id: 'icon_seamless', label: 'ICON (DWD)', color: '#eab308' },
      { id: 'ukmo_seamless', label: 'UKMO', color: '#a855f7' },
      { id: 'meteofrance_seamless', label: 'MeteoFrance', color: '#22c55e' },
      { id: 'gem_seamless', label: 'GEM (Canada)', color: '#f97316' },
      { id: 'jma_seamless', label: 'JMA (Japan)', color: '#14b8a6' },
      { id: 'dwd_icon_eu', label: 'ICON-EU', color: '#ec4899' },
      { id: 'arpege_world', label: 'ARPEGE', color: '#8b5cf6' },
      { id: 'gfs_global', label: 'GFS Global', color: '#06b6d4' }
    ];

    let currentLat = 51.5074;
    let currentLng = -0.1278;
    let currentLocationLabel = "London, Greater London, United Kingdom";
    let selectedDate = new Date().toISOString().split('T')[0];
    let isFetching = false;
    let scatterChartInstance = null;
    let searchDebounceTimeout = null;

    const searchInput = document.getElementById('search-input');
    const suggestionsList = document.getElementById('suggestions');
    const dateButtonsContainer = document.getElementById('date-buttons-container');
    const locationText = document.getElementById('location-text');
    const errorDiv = document.getElementById('error');

    function buildDateButtons() {
      dateButtonsContainer.innerHTML = '';
      const today = new Date();

      for (let i = 0; i < 7; i++) {
        const d = new Date(today);
        d.setDate(today.getDate() + i);

        const isoDate = d.toISOString().split('T')[0];
        const dayName = i === 0 ? 'Today' : i === 1 ? 'Tomorrow' : d.toLocaleDateString('en-GB', { weekday: 'short' });
        const dateSub = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = `date-btn ${i === 0 ? 'active' : ''}`;
        btn.innerHTML = `<span>${dayName}</span><span class="btn-sub">${dateSub}</span>`;

        btn.addEventListener('click', () => {
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectedDate = isoDate;
          fetchSingleDayData();
        });

        dateButtonsContainer.appendChild(btn);
      }
    }

    function init() {
      buildDateButtons();

      searchInput.addEventListener('input', handleSearchInput);
      document.addEventListener('click', (e) => {
        if (!searchInput.contains(e.target) && !suggestionsList.contains(e.target)) {
          suggestionsList.style.display = 'none';
        }
      });

      fetchSingleDayData();
    }

    function handleSearchInput(e) {
      clearTimeout(searchDebounceTimeout);
      const query = e.target.value.trim();

      if (query.length < 2) {
        suggestionsList.style.display = 'none';
        return;
      }

      searchDebounceTimeout = setTimeout(async () => {
        try {
          const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=en&format=json`);
          const data = await res.json();

          if (!data.results || data.results.length === 0) {
            suggestionsList.innerHTML = `<div class="suggestion-item"><span class="suggestion-name">No locations found</span></div>`;
            suggestionsList.style.display = 'block';
            return;
          }

          renderSuggestions(data.results);
        } catch (err) {
          console.error("Geocoding failed", err);
        }
      }, 250);
    }

    function renderSuggestions(results) {
      suggestionsList.innerHTML = '';
      results.forEach(loc => {
        const item = document.createElement('div');
        item.className = 'suggestion-item';

        const hierarchy = [];
        if (loc.admin3) hierarchy.push(loc.admin3);
        if (loc.admin2 && loc.admin2 !== loc.admin3) hierarchy.push(loc.admin2);
        if (loc.admin1 && loc.admin1 !== loc.admin2) hierarchy.push(loc.admin1);
        if (loc.country) hierarchy.push(loc.country);

        const detailText = hierarchy.join(', ');
        const fullLabel = `${loc.name} (${detailText || 'UK'})`;

        item.innerHTML = `
          <div class="suggestion-title">
            <span class="suggestion-name">${loc.name}</span>
            <span class="suggestion-coords">${loc.latitude.toFixed(2)}°, ${loc.longitude.toFixed(2)}°</span>
          </div>
          <span class="suggestion-details">${detailText || 'Location'}</span>
        `;

        item.addEventListener('click', () => {
          currentLat = loc.latitude;
          currentLng = loc.longitude;
          currentLocationLabel = fullLabel;
          searchInput.value = fullLabel;
          suggestionsList.style.display = 'none';
          fetchSingleDayData();
        });

        suggestionsList.appendChild(item);
      });

      suggestionsList.style.display = 'block';
    }

    // Fetches each model individually so one model's failure won't crash the rest
    async function fetchSingleDayData() {
      if (isFetching) return;
      isFetching = true;

      errorDiv.style.display = 'none';
      locationText.innerText = currentLocationLabel;

      const times = Array.from({ length: 24 }, (_, i) => `${i.toString().padStart(2, '0')}:00`);

      // Parallel fetching per model
      const fetchPromises = MODEL_CONFIG.map(async (model) => {
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLng}&hourly=temperature_2m,precipitation&start_date=${selectedDate}&end_date=${selectedDate}&timezone=auto&models=${model.id}`;
        try {
          const res = await fetch(url);
          if (!res.ok) return null;
          const json = await res.json();
          if (!json || !json.hourly) return null;

          const tempKey = `temperature_2m_${model.id}`;
          const rainKey = `precipitation_${model.id}`;

          return {
            model: model,
            temps: json.hourly[tempKey] || json.hourly['temperature_2m'] || null,
            rains: json.hourly[rainKey] || json.hourly['precipitation'] || null,
            times: json.hourly.time || []
          };
        } catch (err) {
          console.warn(`Failed to load ${model.label}:`, err);
          return null;
        }
      });

      const results = await Promise.all(fetchPromises);
      const validResults = results.filter(r => r !== null);

      if (validResults.length === 0) {
        errorDiv.innerText = 'Error loading forecast data. Please try another location or date.';
        errorDiv.style.display = 'block';
        isFetching = false;
        return;
      }

      renderScatterChart(validResults, times);
      isFetching = false;
    }

    function renderScatterChart(modelResults, hours) {
      const datasets = [];

      modelResults.forEach(res => {
        const { model, temps, rains } = res;

        // Temperature Dataset (Solid Line)
        if (temps) {
          const tempData = temps.map((val, hourIndex) => ({
            x: hourIndex,
            y: val
          }));

          datasets.push({
            label: model.label,
            data: tempData,
            backgroundColor: model.color,
            borderColor: model.color,
            pointStyle: 'circle',
            pointRadius: 6,
            pointHoverRadius: 9,
            showLine: true,
            borderWidth: 2.5,
            yAxisID: 'yTemp'
          });
        }

        // Precipitation Dataset (Dotted Line)
        if (rains) {
          const rainData = rains.map((val, hourIndex) => ({
            x: hourIndex,
            y: val
          }));

          datasets.push({
            label: `${model.label} (Rain)`,
            data: rainData,
            backgroundColor: model.color,
            borderColor: model.color,
            pointStyle: 'circle',
            pointRadius: 5,
            pointHoverRadius: 8,
            showLine: true,
            borderWidth: 1.5,
            borderDash: [4, 4],
            yAxisID: 'yRain'
          });
        }
      });

      const ctx = document.getElementById('scatterChart').getContext('2d');
      if (scatterChartInstance) scatterChartInstance.destroy();

      scatterChartInstance = new Chart(ctx, {
        type: 'scatter',
        data: { datasets: datasets },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'top',
              labels: { 
                color: '#f8fafc', 
                boxWidth: 14, 
                font: { size: 12, weight: '500' },
                padding: 12,
                filter: (legendItem) => !legendItem.text.includes('(Rain)')
              }
            },
            tooltip: {
              titleFont: { size: 14 },
              bodyFont: { size: 13 },
              padding: 12,
              callbacks: {
                title: (items) => items.length ? `Time: ${hours[items[0].parsed.x] || ''}` : '',
                label: (ctx) => {
                  const isTemp = ctx.dataset.yAxisID === 'yTemp';
                  const unit = isTemp ? '°C' : 'mm';
                  const type = isTemp ? 'Temp' : 'Rain';
                  return `${ctx.dataset.label.replace(' (Rain)', '')} (${type}): ${ctx.parsed.y} ${unit}`;
                }
              }
            }
          },
          scales: {
            x: {
              type: 'linear',
              position: 'bottom',
              ticks: {
                color: '#94a3b8',
                stepSize: 1,
                font: { size: 13 },
                callback: (val) => hours[val] || ''
              },
              grid: { color: '#334155' },
              min: 0,
              max: 23,
              title: { 
                display: true, 
                text: 'Hour of Day', 
                color: '#94a3b8',
                font: { size: 14, weight: 'bold' },
                padding: { top: 10 }
              }
            },
            yTemp: {
              type: 'linear',
              position: 'left',
              ticks: { color: '#f8fafc', font: { size: 13 } },
              grid: { color: '#334155' },
              title: { 
                display: true, 
                text: 'Temperature (°C)', 
                color: '#f8fafc',
                font: { size: 14, weight: 'bold' } 
              }
            },
            yRain: {
              type: 'linear',
              position: 'right',
              min: 0,
              ticks: { color: '#38bdf8', font: { size: 13 } },
              grid: { drawOnChartArea: false },
              title: { 
                display: true, 
                text: 'Rain (mm)', 
                color: '#38bdf8',
                font: { size: 14, weight: 'bold' } 
              }
            }
          }
        }
      });
    }

    window.onload = init;
  </script>
</body>
</html>
